trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  imageName: 'api-clyvo' # O nome limpo da imagem

stages:
- stage: BuildAndTest
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: 'src/**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: 'src/GuardianPet.Tests.Unit/GuardianPet.Tests.Unit.csproj'
        arguments: '--configuration $(buildConfiguration)'
    - task: Docker@2
      inputs:
        command: 'buildAndPush'
        repository: '$(imageName)'
        dockerfile: 'src/Dockerfile'
        buildContext: 'src'
        containerRegistry: 'DockerRegistryConnection'
        tags: |
          $(Build.BuildId)
          latest
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'src/Dockerfile'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  dependsOn: BuildAndTest
  jobs:
  - job: DeployACI
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "1. Obtendo a credencial do ACR..."
          ACR_PASS=$(az acr credential show --name acrchallengedevops2026 --query "passwords[0].value" -o tsv)
          
          echo "2. Limpando container antigo (se existir) para evitar conflitos..."
          az container delete --resource-group RG-Challenge-DevOps --name api-container --yes || true
          
          echo "3. Fazendo o Deploy da nova imagem no ACI..."
          az container create \
            --resource-group RG-Challenge-DevOps \
            --name api-container \
            --image acrchallengedevops2026.azurecr.io/api-clyvo:latest \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server acrchallengedevops2026.azurecr.io \
            --registry-username acrchallengedevops2026 \
            --registry-password "$ACR_PASS" \
            --dns-name-label api-clyvo-devops \
            --ports 8080 \
            --environment-variables ConnectionStrings__DefaultConnection="Data Source=(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=db-clyvo-devops.eastus.azurecontainer.io)(PORT=1521)))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=FREEPDB1)));User Id=admin;Password=ClyvoOracle2026!;"