trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  imageName: 'api-clyvo'
  acrName: 'acrchallengedevops2026'

stages:
- stage: BuildAndTest
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: 'src/**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'
        
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: 'src/GuardianPet.Tests.Unit/GuardianPet.Tests.Unit.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: AzureCLI@2
      displayName: 'Docker Login, Build and Push via CLI'
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # 1. Obtém a senha do ACR dinamicamente
          ACR_PASS=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)
          
          # 2. Faz o login no Docker do Agent
          echo "$ACR_PASS" | docker login $(acrName).azurecr.io -u $(acrName) --password-stdin
          
          # 3. Constrói a imagem localmente
          docker build -t $(acrName).azurecr.io/$(imageName):latest -t $(acrName).azurecr.io/$(imageName):$(Build.BuildId) -f src/Dockerfile src/
          
          # 4. Envia para o ACR
          docker push $(acrName).azurecr.io/$(imageName):latest
          docker push $(acrName).azurecr.io/$(imageName):$(Build.BuildId)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'src/Dockerfile'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  dependsOn: BuildAndTest
  jobs:
  - job: DeployACI
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_PASS=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)
          az container delete --resource-group RG-Challenge-DevOps --name api-container --yes || true
          az container create \
            --resource-group RG-Challenge-DevOps \
            --name api-container \
            --image $(acrName).azurecr.io/$(imageName):latest \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server $(acrName).azurecr.io \
            --registry-username $(acrName) \
            --registry-password "$ACR_PASS" \
            --dns-name-label api-clyvo-devops \
            --ports 8080 \
            --environment-variables ConnectionStrings__OracleConnection="Data Source=(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=db-clyvo-devops.eastus.azurecontainer.io)(PORT=1521)))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=FREEPDB1)));User Id=admin;Password=ClyvoOracle2026!;" ASPNETCORE_ENVIRONMENT="Development" ASPNETCORE_URLS="http://+:8080"